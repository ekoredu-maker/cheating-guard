name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'js/**'
      - 'assets/**'
      - 'data/**'
      - 'icons/**'
      - 'manifest.webmanifest'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 웹 화면을 앱에 포함
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r index.html manifest.webmanifest service-worker.js assets js data icons android/app/src/main/assets/www/

      - name: APK 빌드
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp android/app/build/outputs/apk/release/app-release.apk cheating-guard.apk

      - name: 빌드 결과 기록 (android-build 브랜치)
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || echo "no log" > out/build.log
          tail -n 120 out/build.log > out/build-tail.log || true
          cp cheating-guard.apk out/ 2>/dev/null || true
          echo "status=${{ job.status }} run=${{ github.run_number }} sha=${{ github.sha }}" > out/STATUS.txt
          cd out
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -q -b android-build
          git add -A
          git commit -q -m "Android build ${{ github.run_number }} (${{ job.status }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-build

      - name: 최신 APK 배포 (Releases)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 칫팅가드 Android 앱 (최신)
          body: |
            칫팅가드 Android 앱 최신 빌드 (빌드 번호 ${{ github.run_number }})
            - cheating-guard.apk 를 휴대폰에서 내려받아 설치하세요. (설치 시 '출처를 알 수 없는 앱' 허용 필요)
            - 인터넷 권한이 없으며, 모든 분석은 휴대폰 안에서만 이루어집니다.
          files: cheating-guard.apk
          make_latest: true
